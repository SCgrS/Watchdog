# CodeQL security scan, advanced setup ("CodeQL Advanced"). The Kotlin code is scanned while the app is built
# (build-mode: manual), the workflow files without building (build-mode: none). Before the build, the Gradle wrapper JAR
# is compared with the checksum Gradle publishes, so a changed wrapper in a pull request never runs.
# GitHub's default setup must be turned off, the two cannot run together:
#   gh api -X PATCH repos/SCgrS/Watchdog/code-scanning/default-setup -f state=not-configured
name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # every Monday at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the Gradle wrapper
        if: matrix.build-mode == 'manual'
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "Gradle ${version} wrapper. Expected ${expected}, found ${actual}"
          test "$expected" = "$actual"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache assembleDebug

      - name: Scan
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # The analysis step succeeds even when the scan finds alerts. This step counts the open CodeQL alerts on the main
      # branch (on a pull request, on that request) and fails the job if there are any, so a "passing" badge means there
      # are no open alerts. A false alarm is dismissed with a reason in the Security tab.
      - name: Fail if there are open alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&tool_name=CodeQL&ref=$GITHUB_REF&per_page=100" --jq 'length')
          echo "Open CodeQL alerts: $count"
          test "$count" -eq 0
